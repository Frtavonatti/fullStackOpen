services:
  app:
    image: hello-front-dev
    build:
      context: . # The context uses this directory as the build context
      dockerfile: Dockerfile.dev # This points to which Dockerfile to use
    volumes:
      - ./:/usr/src/app # The path can be relative, so ./ is enough to refer to the same location as the docker-compose.yml
    ports:
      - 5173:5173
    container_name: hello-front-dev # This will name the container hello-front-dev
  debug-helper:
    image: busybox
  nginx: 
    image: nginx:1.20.1
    volumes: 
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: reverse-proxy
    depends_on:
      - app