services:
  mongo:
    image: initialized-mongo:latest
    ports:
      - "3456:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./mongo_data:/data/db

  redis: 
    image: redis:latest
    ports:
      - "6379:6379"
